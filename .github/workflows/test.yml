name: test
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      # --legacy-peer-deps: the peer chain of @deepseek-ai/dsh-fs pulls in
      # private packages (dsh-type-meta, ...) that exist only inside the DSH
      # host install, not on public npm. CI runs the unit tests (fake-driven),
      # so strict peer resolution is neither possible nor needed — the lock's
      # npmmirror tarballs provide what the tests import.
      - run: npm ci --legacy-peer-deps
      - run: npm test
